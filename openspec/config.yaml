schema: spec-driven
context: |
  Domain: Playwright Chrome Extension Testing Framework — a TypeScript framework and helper library 
  designed for human-centered integration testing of Manifest V3 web extensions (Side Panels, Content Scripts, Service Workers, React UI).

  Tech stack:
  - Language: TypeScript (ES2022 / NodeNext)
  - Core Libraries: Playwright, Chromium DevTools Protocol (CDP)
  - Framework Target: Chrome Extensions (Manifest V3), ReactJS Side Panels
  - Output: NPM Exportable Module (`dist/`) + Local Integration Test Fixtures

  Testing discipline (non-negotiable):
  - Black-box integration tests using Playwright persistent browser contexts.
  - Rely exclusively on human-centered browser interactions and visual/DOM assertions.
  - Do NOT import extension internal source code directly or use Vitest/unit tests for extension behavior.
  - Every test must verify: clean UI rendering, service worker resilience, and absence of console errors.

  Project conventions:
  - Source: Exportable TypeScript core lives in `src/` (`types.ts`, `lifecycle.ts`, `assertions.ts`, `messaging.ts`, `fixtures.ts`).
  - Tests: Test suites live under `tests/` and consume local unpacked extension builds (e.g., `extension_cores/`).
  - Extensibility: Custom Playwright fixtures (`test.extend`) automatically supply `extensionContext`, `extensionId`, and `sidepanelPage`.
  - Maintain backwards compatibility for all exported helper signatures.
  - Helper documentation: use [README_PLAYWRIGHT.md#available-helper-reference](../README_PLAYWRIGHT.md#available-helper-reference) as the user-facing reference for every available helper and fixture.

  Task conventions:
  - Group tasks under `## N. Group Name` headings.
  - Every task must be a checkbox in the form `- [ ] N.M Task description`.
  - Each task must be small, focused, reference the relevant spec scenario, and follow: test creation → implementation → validation.
  - Check off tasks as you complete them one-by-one or section by section.

rules:
  proposal:
    - Include rollback plan for breaking API changes
    - Verify compatibility across Chrome Extension Manifest V3 contexts (Content Script, Background Worker, Sidepanel)
    - Ensure all public helper functions are fully typed in TypeScript
  specs:
    - Use Given/When/Then or Arrange/Act/Assert format for human user stories
    - Reference existing helper functions in `src/` before creating new ones

operations:
  apply:
    guidance:
      - Run specific test files (`npx playwright test tests/path/to/spec.ts`) before running full suite
      - Always test service worker lifecycle changes against service worker restart scenarios
      - Prefer small, focused diffs; keep each helper or utility change under ~30 lines when possible